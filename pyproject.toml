[project]
name = "quake2midi"
version = "0.1.0"
description = "quake2midi: live earthquakes turned into MIDI notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.per-file-ignores]
# Tests read better without a docstring on every test function.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"